
name: Build Rayan Life RPG APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract RPG project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'Rayan_Life_RPG_GitHub_Ready*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "RPG ZIP file not found"
            exit 1
          fi

          mkdir source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR="source/Rayan_Life_RPG_GitHub_Ready"

          test -f "$PROJECT_DIR/settings.gradle"
          test -d "$PROJECT_DIR/app"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayan-Life-RPG-APK
          path: source/Rayan_Life_RPG_GitHub_Ready/app/build/outputs/apk/debug/app-debug.apk
